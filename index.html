  <style>
    :root {
      --ink: #14110f;
      --paper: #efe6d4;
      --bg: #12100e;
      --panel: #1c1814;
      --line: #3a332c;
      --mute: #9a8d7c;
      --text: #f3eadc;
      --soft: #cfc3b0;
      --accent: #e7a35a;
      --open: #d85a3a;
      --review: #e7a35a;
      --fixed: #6f9b72;
      --again: #8b7ec8;
      --pad-w: min(260px, 34vw);
      --tcp-grit: repeating-conic-gradient(
        from 0deg,
        rgba(243, 234, 220, 0.65) 0deg 0.35deg,
        transparent 0.35deg 8deg,
        rgba(231, 163, 90, 0.4) 8deg 8.2deg,
        transparent 8.2deg 15deg,
        rgba(255, 255, 255, 0.4) 15deg 15.18deg,
        transparent 15.18deg 24deg
      );
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      color-scheme: dark;
    }
    .share-name {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Outfit, system-ui, sans-serif;
    }
    button {
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus,
    button:focus-visible {
      outline: none;
    }
    a { color: var(--accent); }

    .shell {
      position: relative;
      height: 100%;
      height: 100dvh;
    }
    .shell.pad-off .pad { display: none; }
    .pad-show {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 18px;
      z-index: 8;
      border: 1px solid rgba(231, 163, 90, 0.55);
      background: rgba(23, 20, 16, 0.18);
      color: var(--accent);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .pad-show:hover { filter: brightness(1.15); }
    .shell.pad-off .pad-show { display: block; }
    .trail {
      border-right: 1px solid #2a2420;
      padding: 16px 10px 24px 14px;
      background: #0c0b0e;
      z-index: 2;
    }
    .main {
      padding: 0;
      min-width: 0;
      position: relative;
      height: 100%;
      height: 100dvh;
      background: #050408;
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }
    .hud .where { margin-bottom: 0; pointer-events: auto; }
    .brand {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      flex: 1;
      pointer-events: none;
    }
    .logo, .where { pointer-events: auto; }
    .logo {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .logo svg { display: block; width: 36px; height: 36px; }
    .logo:hover { filter: brightness(1.18); }
    #watch { pointer-events: auto; }
    .watch {
      pointer-events: auto;
      max-width: 280px;
      background: #171410;
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
    }
    .watch .kicker { margin: 0 0 4px; }
    .watch b { display: block; font-size: 13px; line-height: 1.3; margin-bottom: 6px; }
    .watch-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .watch-row .tix-ext { font-size: 11px; }
    .watch-row button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .watch-row button.ghost {
      background: transparent;
      color: var(--accent);
    }

    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 12% 22%, rgba(64, 44, 148, 0.58), transparent 58%),
        radial-gradient(ellipse 80% 50% at 88% 78%, rgba(22, 82, 128, 0.48), transparent 55%),
        radial-gradient(ellipse 50% 40% at 62% 18%, rgba(124, 38, 94, 0.28), transparent 60%),
        radial-gradient(ellipse at 50% 48%, #12101c 0%, #08070f 52%, #020208 100%);
    }
    .shell:not(.pad-off) .sky,
    .shell:not(.pad-off) .sky-weather {
      right: var(--pad-w);
    }
    .shell:not(.pad-off) .hud {
      right: var(--pad-w);
    }
    .sky.scale-galaxy {
      background:
        radial-gradient(ellipse 90% 55% at 16% 24%, rgba(64, 44, 148, 0.48), transparent 58%),
        linear-gradient(180deg, transparent 36%, rgba(90,70,50,0.1) 50%, transparent 64%),
        radial-gradient(ellipse at 50% 50%, #141018 0%, #08060e 70%);
    }
    .sky.scale-star {
      background:
        radial-gradient(ellipse 70% 50% at 50% 46%, rgba(112, 64, 24, 0.3), transparent 46%),
        radial-gradient(ellipse at 50% 50%, #16101a 0%, #08070e 62%, #030208 100%);
    }
    .sky.scale-planet {
      background:
        radial-gradient(ellipse 80% 50% at 78% 70%, rgba(22, 82, 128, 0.32), transparent 50%),
        radial-gradient(ellipse at 50% 58%, #141018 0%, #08070c 70%);
    }
    .sky.scale-planes, .sky.scale-plane {
      background: radial-gradient(ellipse at 50% 40%, #16120e 0%, #060508 70%);
    }
    .sky.scale-worldline {
      background: radial-gradient(ellipse at 42% 58%, #161018 0%, #05040a 70%);
    }
    .sky.scale-helix {
      background: radial-gradient(ellipse at 50% 48%, #1a1214 0%, #07050a 70%);
    }
    .sky.scale-beacon {
      background: radial-gradient(ellipse at 62% 36%, #141820 0%, #05060a 70%);
    }
    .sky.scale-engine, .sky.scale-lab {
      background:
        radial-gradient(ellipse at 22% 58%, #1a1410 0%, transparent 42%),
        radial-gradient(ellipse at 78% 38%, #121820 0%, #05060a 62%);
    }
    .sky.scale-nebula {
      background: radial-gradient(ellipse at 58% 48%, #1a1418 0%, #08060c 68%);
    }
    .sky.scale-galaxy::before {
      background:
        radial-gradient(ellipse 90% 28% at 50% 50%, rgba(243,234,220,0.08), transparent 70%),
        radial-gradient(circle at 50% 50%, transparent 38%, #050408 100%);
    }
    .sky.scale-star::before {
      background: radial-gradient(circle at 50% 50%, rgba(231,163,90,0.16) 0%, transparent 34%, #050408 100%);
    }
    .sky.scale-planet::before {
      background: linear-gradient(180deg, transparent 42%, rgba(18,10,8,0.92) 100%);
    }
    .sky.scale-ticket::before, .sky.scale-box::before {
      background: radial-gradient(circle at 50% 86%, rgba(90,70,50,0.28), transparent 38%),
        linear-gradient(180deg, transparent 0%, transparent 52%, rgba(8,6,12,0.72) 100%);
    }
    .sky.scale-plane.tcp-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(231,163,90,0.22) 100%);
    }
    .sky.scale-plane.udp-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(94,196,189,0.2) 100%);
    }
    .sky.scale-plane.send-sky::before {
      background: linear-gradient(180deg, transparent 36%, rgba(243,234,220,0.18) 100%);
    }
    .sky.scale-box { background: radial-gradient(ellipse at 50% 70%, #1c1510 0%, #070508 72%); }
    .sky.warping-in { animation: warpIn 0.45s ease-in; }
    .sky.warping-out { animation: warpOut 0.45s ease-in; }
    @keyframes warpIn {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(1.03); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    @keyframes warpOut {
      0% { filter: blur(0); transform: scale(1); opacity: 1; }
      45% { filter: blur(4px); transform: scale(0.98); opacity: 0.78; }
      100% { filter: blur(0); transform: scale(1); opacity: 1; }
    }
    .sky::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(5, 4, 8, 0.82) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .sky::after {
      content: "";
      position: absolute;
      inset: -8%;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
      animation: starDrift 96s linear infinite;
      background-image:
        radial-gradient(1px 1px at 8% 14%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 22% 38%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 41% 11%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 63% 22%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 81% 9%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 91% 41%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 14% 62%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 33% 71%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 58%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 74% 66%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 78%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 84%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 47% 88%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 69% 91%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 18% 48%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 58% 34%, #f3eadc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 77% 51%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 95% 63%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 37% 24%, #f3eadc 50%, transparent 51%),
        radial-gradient(1px 1px at 4% 31%, #f3eadc 50%, transparent 51%);
    }
    .sky.scale-galaxy::after, .sky.scale-star::after, .sky.scale-ticket::after, .sky.scale-box::after, .sky.scale-planet::after { opacity: 1; }
    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-5%, -4%, 0); }
    }
    .rings, .kepler {
      position: absolute;
      inset: 6% 4%;
      width: 92%;
      height: 88%;
      pointer-events: none;
      z-index: 1;
    }
    .rings ellipse, .kepler ellipse {
      fill: none;
      stroke: rgba(236, 222, 192, 0.42);
      stroke-width: 1.05px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 0 2.8 0 7.1 0 1.6 0 11.4 0 4.2 0 6.6 0 2.1 0 9.3 0 3.4;
      stroke-linecap: round;
      animation: wellDrift 48s linear infinite;
    }
    .kepler ellipse.grit {
      stroke: rgba(243, 234, 220, 0.26);
      stroke-width: 0.55px;
      stroke-dasharray: 0 1.4 0 4.8 0 0.9 0 6.6 0 2.2 0 5.1 0 1.1 0 8.4 0 3.3;
      animation-duration: 31s;
      animation-direction: reverse;
    }
    .kepler ellipse.dust {
      stroke: rgba(198, 176, 148, 0.2);
      stroke-width: 0.45px;
      stroke-dasharray: 0 5.6 0 12.8 0 3.2 0 9.4 0 16.2 0 7.1;
      animation-duration: 67s;
    }
    .kepler .moons {
      stroke: rgba(231, 163, 90, 0.32);
      animation-duration: 40s;
      animation-direction: reverse;
    }
    @keyframes wellDrift {
      to { stroke-dashoffset: -56; }
    }
    .web {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .web path {
      fill: none;
      stroke: rgba(231, 163, 90, 0.16);
      stroke-width: 0.5px;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1.6 8 0.55 11;
      stroke-linecap: butt;
      animation: wellDrift 80s linear infinite;
    }
    .dust-sheet {
      position: absolute;
      inset: -28%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.14;
      background-image:
        radial-gradient(circle, rgba(210,228,255,0.35) 0.55px, transparent 1px),
        radial-gradient(circle, rgba(255,220,170,0.18) 0.4px, transparent 0.85px);
      background-size: 263px 211px, 191px 167px;
    }
    .sky-spark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .sky-spark i {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #e6ecf5;
      opacity: 0.52;
    }
    .sky-spark i.dim {
      width: 1px;
      height: 1px;
      background: #c5d4e8;
      animation: glowSoft 11s ease-in-out infinite;
    }
    .sky-spark i.spark {
      background: #f7f4ee;
      box-shadow: 0 0 7px rgba(236, 240, 250, 0.82);
      animation: twinkle 3.8s ease-in-out infinite;
    }
    .sky-spark i.warm {
      background: #f0e2c8;
      width: 2px;
      height: 2px;
      box-shadow: 0 0 6px rgba(240, 220, 190, 0.6);
      animation: glowSoft 9s ease-in-out infinite;
    }
    .sky-spark i.dying {
      background: #dce6f4;
      animation: dieOff 26s ease-in-out infinite;
    }
    .sky-spark i.soft {
      background: #e4eaf4;
      animation: glowSoft 8.5s ease-in-out infinite;
    }
    .sky-spark i.diamond {
      display: none;
      width: 3px;
      height: 3px;
      border-radius: 0;
      background: #e8dff4;
      box-shadow: 0 0 4px rgba(200, 180, 230, 0.45);
      transform: rotate(45deg);
      opacity: 0.55;
      animation: diamondTwinkle 4.2s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond { display: block; }
    html.alt-universe .sky-spark i.shift {
      animation: hueTwinkle 3.6s ease-in-out infinite;
    }
    html.alt-universe .sky-spark i.diamond.shift {
      animation: diamondHue 4.2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.18; transform: scale(0.75); }
      47% { opacity: 0.52; }
      51% { opacity: 1; transform: scale(1.38); }
      56% { opacity: 0.32; transform: scale(0.85); }
    }
    @keyframes diamondTwinkle {
      0%, 100% { opacity: 0.22; transform: rotate(45deg) scale(0.8); }
      48% { opacity: 0.7; transform: rotate(45deg) scale(1.15); }
      54% { opacity: 1; transform: rotate(45deg) scale(1.28); }
      62% { opacity: 0.4; transform: rotate(45deg) scale(0.9); }
    }
    @keyframes hueTwinkle {
      0%, 100% { background: #e6ecf5; box-shadow: 0 0 4px rgba(230, 236, 245, 0.4); }
      50% { background: #cfc0e4; box-shadow: 0 0 6px rgba(180, 150, 220, 0.42); }
    }
    @keyframes diamondHue {
      0%, 100% { background: #e8dff4; box-shadow: 0 0 4px rgba(200, 180, 230, 0.45); transform: rotate(45deg) scale(0.8); }
      50% { background: #d4b8ea; box-shadow: 0 0 7px rgba(170, 130, 220, 0.5); transform: rotate(45deg) scale(1.2); }
    }
    html.alt-universe .sky.scale-engine,
    html.alt-universe .sky.scale-lab {
      background:
        linear-gradient(rgba(92, 48, 140, 0.2), rgba(92, 48, 140, 0.2)),
        radial-gradient(ellipse at 22% 58%, #1a1410 0%, transparent 42%),
        radial-gradient(ellipse at 78% 38%, #121820 0%, #05060a 62%);
    }
    html.universe-shift .starfield {
      animation: starStretch 0.92s ease-in-out;
      transform-origin: 50% 50%;
    }
    html.universe-shift .sky::after {
      animation: starDrift 96s linear infinite, starStretch 0.92s ease-in-out;
      transform-origin: 50% 50%;
    }
    html.universe-shift .engine-stage.close-sim {
      animation: sceneBend 0.92s ease-in-out;
    }
    @keyframes starStretch {
      0% { transform: scale(1) translate(0, 0); filter: none; }
      28% { transform: scaleX(1.72) scaleY(0.7) skewX(-16deg) translate(5%, -3%); filter: blur(1.6px) saturate(1.35); }
      58% { transform: scaleX(0.82) scaleY(1.28) skewX(11deg) translate(-4%, 4%); filter: blur(1px); }
      100% { transform: scale(1) translate(0, 0); filter: none; }
    }
    @keyframes sceneBend {
      0% { filter: none; }
      40% { filter: blur(2.2px) contrast(1.18) hue-rotate(-12deg); }
      100% { filter: none; }
    }
    @keyframes glowSoft {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.82; }
    }
    @keyframes dieOff {
      0% { opacity: 0.75; }
      28% { opacity: 0.32; }
      52% { opacity: 0.06; }
      64% { opacity: 0; }
      82% { opacity: 0.14; }
      100% { opacity: 0.62; }
    }
    .starfield {
      position: absolute;
      inset: -18%;
      pointer-events: none;
      z-index: 1;
    }
    .sf-layer {
      position: absolute;
      inset: 0;
    }
    .sf-layer.far {
      filter: blur(0.85px);
      opacity: 0.92;
    }
    .sf-layer.mid {
      filter: blur(0.25px);
      opacity: 1;
    }
    .sf-layer b {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 1px;
      border-radius: 50%;
      background: transparent;
    }
    .nova {
      position: absolute;
      width: 9px;
      height: 9px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #fffef8 0%, #ffe08a 22%, rgba(255,150,70,0.38) 40%, transparent 68%);
      opacity: 0;
      animation: supernova 46s linear infinite;
    }
    .nova.n1 { left: 16%; top: 24%; }
    .nova.n2 {
      left: 78%;
      top: 58%;
      animation-duration: 63s;
      animation-delay: -28s;
      background: radial-gradient(circle, #f4fbff 0%, #9ad0ff 24%, rgba(80,140,220,0.32) 42%, transparent 68%);
    }
    @keyframes supernova {
      0%, 87%, 100% { opacity: 0; transform: scale(0.2); }
      88.2% { opacity: 1; transform: scale(1.6); }
      91% { opacity: 0.45; transform: scale(10); }
      95% { opacity: 0; transform: scale(18); }
    }
    .sky-weather {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }
    .wx-flare {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 70%;
      height: 62%;
      transform: translate(-50%, -50%) scale(0.12);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,236,190,0.4) 0%, rgba(231,163,90,0.14) 32%, transparent 70%);
      animation: wxFlare 3.2s ease-out forwards;
    }
    @keyframes wxFlare {
      0% { transform: translate(-50%, -50%) scale(0.12); opacity: 0.2; }
      40% { transform: translate(-50%, -50%) scale(1); opacity: 0.38; }
      100% { transform: translate(-50%, -50%) scale(1.85); opacity: 0; }
    }
    .wx-mote {
      position: absolute;
      width: 3px;

      animation: ringSpinTcp 70s linear infinite;

    .plane-ring.udp {
      width: 58%;

        rgba(180, 240, 230, 0.6) 0deg 0.35deg,

      to { transform: translate(-50%, -50%) rotateX(66deg) translateZ(110px) rotateZ(360deg); }

    @keyframes ringSpinUdp {
      from { transform: translate(-50%, -50%) rotateX(66deg) translateZ(-80px) rotateZ(0deg); }

  <script>
    const UMAMI_WEBSITE_ID = "071e8874-ccc3-4e3b-99f5-12cca93b5890";
    (function () {
      if (!UMAMI_WEBSITE_ID) return;
      const host = location.hostname;
      if (!host || host === "localhost" || host === "127.0.0.1") return;
      const s = document.createElement("script");

      s.setAttribute("data-website-id", UMAMI_WEBSITE_ID);
      s.setAttribute("data-domains", "emms21.github.io");
      document.head.appendChild(s);
    })();
    function track(name, data) {
      try { if (window.umami) window.umami.track(name, data); } catch (e) {}
    }
    let engagedSent = false;
    function markEngaged(how) {
      if (engagedSent) return;
      engagedSent = true;
      track("engaged", { how: how });
    }
    setTimeout(function () { markEngaged("time"); }, 20000);

    const ISSUES = {
      4663: { id: 4663, title: "Redis hiccup takes the whole platform down", see: "Redis is unreachable for a few minutes. The cluster stays dead for almost an hour. People cannot join. Someone has to delete every machine.", status: "review", why: "Health checks treat Redis as the heartbeat. Kubernetes kills every node at once, then drain waits forever.", url: "https://github.com/livekit/livekit/issues/4663" },
      4726: { id: 4726, title: "Same room name kills the next call", label: "I deleted a room and quickly tried to create a room with the same name", see: "They delete a room by name. They create a new room with that same name. People join. Then everyone is kicked out.", status: "review", why: "Delete does not free the name until the old meeting has fully died. The new call lands in the old one.", url: "https://github.com/livekit/livekit/issues/4726", thread: [
        { ask: "They delete the room, recreate that name, everyone is kicked", kind: "engine", say: "Delete one name on this program. Close hangs up that meeting on each person's TCP. Until that finishes the name is still taken. Create that same name and the new call lands in the old meeting. Then Leave arrives and they are kicked.", thread: [
          { ask: "Delete, then create that name", kind: "lab", code: "closeLab", say: "Delete this name. Then create with this name. If Close is still running, Redis still has the name. CreateRoom fails until hang-up finishes." },
          { ask: "TCP", kind: "geodesic", say: "That person's ordered stream. The outbound queue sits inside it. Front toward the phone. Leave appends at the back." },
          { ask: "Stream.Send", kind: "pulse", say: "The write of whatever is already on that person's outbound queue onto that person's TCP. One batch. It sits until the write finishes. That sit is the wait." }
        ] }
      ] },
      4558: { id: 4558, title: "Delete does not actually free the room", see: "The room vanishes from the list. Recreate it too soon and you get the old room. It then auto-closes while people are talking.", status: "review", why: "Same race as #4726. The old hang-up timer is still running.", url: "https://github.com/livekit/livekit/issues/4558" },
      3766: { id: 3766, title: "Empty rooms you cannot delete", see: "The list shows empty rooms. Delete says they do not exist. One test left 8,682 of them.", status: "open", why: "The list reads Redis. Delete needs a live meeting on a machine. Those two copies disagree.", url: "https://github.com/livekit/livekit/issues/3766" },
      2703: { id: 2703, title: "After a week, no machine will take a room", see: "New rooms fail. The process looks healthy. A restart unblocks it.", status: "review", why: "Dead machines were only cleaned at startup, so the registry fills with ghosts.", url: "https://github.com/livekit/livekit/issues/2703" },
      1821: { id: 1821, title: "Video is sending, new people cannot see it", see: "Egress is still recording. New joiners cannot see the publisher. Redis is missing that person.", status: "open", why: "The Redis copy of the room and the live copy drift under load.", url: "https://github.com/livekit/livekit/issues/1821" },
      1032: { id: 1032, title: "A shutting-down machine waits forever", see: "Scale-down sits in Terminating for hours. Other machines overload.", status: "open", why: "Drain waits for the last person. There is no deadline on the server.", url: "https://github.com/livekit/livekit/issues/1032" },
      2399: { id: 2399, title: "Join and leave events are wrong", see: "Your backend cannot tell who is in the room. Billing and recordings go wrong.", status: "open", why: "These events fire as a side effect of close paths that already race.", url: "https://github.com/livekit/livekit/issues/2399" },
      4825: { id: 4825, title: "Speaker device is Connected, and silent", see: "An ESP32 says Connected. No audio ever arrives. It reconnects every 15 seconds.", status: "open", why: "Send works. Receive never starts its data channel. The server never even logs it.", url: "https://github.com/livekit/livekit/issues/4825" },
      2046: { id: 2046, title: "They see you. You see nobody.", see: "Others see your camera for a few seconds. You see a blank room. Then you are dropped.", status: "open", why: "You send on one connection and receive on another. Only the receive path dies.", url: "https://github.com/livekit/livekit/issues/2046" },
      4814: { id: 4814, title: "Chat works. Video never starts.", see: "The control socket is fine. Media never connects from the internet.", status: "open", why: "The server advertises the public IP with the private port. NAT is not 1:1.", url: "https://github.com/livekit/livekit/issues/4814" },
      4716: { id: 4716, title: "Works on wifi or the internet, never both", see: "LAN is fine or WAN is fine. Both at once needs TURN.", status: "open", why: "There is no setting to advertise two addresses the machine does not own.", url: "https://github.com/livekit/livekit/issues/4716" },
      2088: { id: 2088, title: "You set a private IP. It still offers a public one.", see: "VPN meetings never connect. Candidates contain the cloud public IP.", status: "open", why: "A command-line IP flag does not always stop the server discovering another address.", url: "https://github.com/livekit/livekit/issues/2088" },
      4359: { id: 4359, title: "Firefox cannot join. Chrome can.", see: "Firefox hangs on Connecting. Chrome on the same network is fine.", status: "open", why: "Firefox is strict about ICE and SDP. Chrome forgives mismatches.", url: "https://github.com/livekit/livekit/issues/4359" },
      1755: { id: 1755, title: "First join times out. Retry also fails.", see: "Works on VPN. Fails on the company network, especially with two NATs.", status: "open", why: "If the control socket blips during ICE, the server skips the next network path.", url: "https://github.com/livekit/livekit/issues/1755" },
      2344: { id: 2344, title: "TURN is on, clients get the wrong port", see: "You set a custom TURN port. Clients are still told to use 443.", status: "review", why: "The listen port and the advertised port are not the same setting.", url: "https://github.com/livekit/livekit/issues/2344" },
      4702: { id: 4702, title: "Logs say switch to TCP. It never did.", see: "Video shreds on bad NAT. Logs repeat 'switch to TCP'. The connection stays on UDP.", status: "again", why: "The log ran. The actual switch did not. Fixed in 1.13.6.", url: "https://github.com/livekit/livekit/issues/4702" },
      4477: { id: 4477, title: "After airplane mode, the agent looks gone", label: "Airplane mode", see: "The websocket isn't starting when we expect it to start.", status: "open", why: "", url: "https://github.com/livekit/livekit/issues/4477", steps: [
        { ask: "The websocket isn't starting when we expect it to start", say: "Yes. The phone already has internet. We expect the SDK to open the control websocket then. It waits, because its retry timer grew while you were offline." },
        { ask: "The retry is late, so they stay disconnected longer than necessary", say: "The user starts a live session with an AI voice agent. The websocket is what creates and maintains the call. The user is in the call, then goes on airplane mode, which cuts the connection. The internet returns, but the retry is late, so they stay disconnected longer than necessary." }
      ], thread: [
            { ask: "What is the retry?", kind: "engine", say: "A wait-timer in LiveKit's Flutter SDK on this phone. After the websocket dies, the SDK waits, then calls connect again. Retry is one clock inside this SDK. The connection is the live link (websocket + voice).", thread: [
              { ask: "Run the simulation", kind: "lab", say: "The OS either tears down the websocket and TCP connection or leaves it open with nothing moving in it." },
              { ask: "How connect starts", kind: "ignite", say: "The app calls room.connect. That is the SDK opening the websocket." },
              { ask: "Sends the ping", kind: "clock", code: "pingInterval", say: "Runs only while the call is already up. Every 5s it writes the ping onto the live websocket, asking the server if this socket still carries LiveKit messages." },
              { ask: "Waits for the pong", kind: "clock", code: "pingTimeout", say: "Runs only while the call is up. It watches for teal. If 15s pass with no pong, the SDK treats the websocket as dead. That death is what creates the retry clock." },
              { ask: "ping", kind: "pulse", say: "Same ping the send clock writes. Gold out, teal back. Missing teal for 15s is death. Death starts the retry wait. The retry wait is what later calls connect." },
              { ask: "Retry wait", kind: "clock", code: "retryWait", say: "The clock that calls connect again. It lives in this SDK. After the websocket is dead, it waits (0ms, then 300ms, up to 7s) and calls connect. #4477 is this clock still counting after internet is back." },
              { ask: "TCP", kind: "geodesic", say: "The ordered stream between this phone and the LiveKit server — the same gold plane at The connection. TCP carries the websocket. Airplane mode can cut it, or leave it half-open so the stream still looks there while the websocket is silent." },
              { ask: "The websocket", kind: "tube", say: "The control socket the SDK opened. Join, tracks, ping, and pong all travel on it. It rides TCP. If it goes quiet for 15s, the SDK treats the call as dead even if TCP has not closed." }
        ] },
        { ask: "Where does WebRTC fit?", say: "WebRTC is the voice path: What they send / What they hear, on UDP. The late retry is the websocket still in backoff. After control is up, WebRTC can play audio again (TrackSubscribed). The agent looks gone because ParticipantConnected is a websocket event for a new join. A resume does not send it." }
      ] },
      854: { id: 854, title: "Stop screen share, start again, it hangs", see: "The second publish waits about 15 seconds, then times out. React remounts hit this in development.", status: "open", why: "This is a server control-socket bug. An old 2022 fix did not cover a publish that was cancelled mid-way.", url: "https://github.com/livekit/livekit/issues/854" },
      4594: { id: 4594, title: "Screen share freezes when quality goes up", see: "Looks fine for about a minute. The picture freezes the moment the server upgrades resolution.", status: "review", why: "VP9 screen share is treated like a layered stream. Every resolution is mapped to layer zero.", url: "https://github.com/livekit/livekit/issues/4594" },
      4695: { id: 4695, title: "One person gets a black screen forever", see: "They cannot decode H.265. Everyone else sees the picture. No fallback to H.264.", status: "open", why: "The server keeps retrying the codec that does not work instead of switching that viewer.", url: "https://github.com/livekit/livekit/issues/4695" },
      4813: { id: 4813, title: "Latency tests lie", see: "Capture-time headers are stripped or rewritten. A/V still looks in sync.", status: "review", why: "The header is used for lip-sync.", url: "https://github.com/livekit/livekit/issues/4813" },
      4724: { id: 4724, title: "Pacing is on in config, off in reality", see: "You turn on rate pacing. Congested viewers still get bursts. No startup error.", status: "review", why: "The name is accepted. The pacer is never attached.", url: "https://github.com/livekit/livekit/issues/4724" },

        : skyKids.map((c, i) => {
        const n = countInside(c);
        const g = nodeIsMapped(c);
        const knownI = knownKids.indexOf(c);
        const slot = strataHere ? strataSlot(c.id) : null;
        const p = slot
          ? { left: slot.left, top: slot.top, z: slot.z, rock: slot.rock }
          : c.unexplored
          ? { left: 72, top: phoneSky() ? 48 : 70 }
          : asBoxes
          ? boxSlot(i, skyKids.length)
          : atUniverse
          ? webPts[knownI]
          : uniDepth === 1
          ? bodyOrbitPos(knownI, knownKids.length, now, starRx, starRy, starPeriod)
          : uniDepth === 2
          ? bodyOrbitPos(knownI, knownKids.length, now, planetRx, planetRy, planetPeriod)
          : bodyOrbitPos(knownI, knownKids.length, now, 30, 26, planetPeriod);
        const zStyle = slot ? `;transform:translate(-50%,-50%) translateZ(${slot.z}px)` : "";
        const rockClass = slot && slot.rock ? " rock-" + slot.rock : "";
        const rockTag = slot && slot.rock ? `<span class="rock-tag">${slot.rock}</span>` : "";
        if (asBoxes && (atTicket || atBox)) {
          const p = boxSlot(i, skyKids.length);
          const deeper = (c.children || []).length > 0;
          const extra = !!(c.who && c.who !== c.name);
          const canEnter = deeper || extra;
          const tag = canEnter ? "button" : "div";
          const enter = canEnter ? ` type="button" data-enter="${c.id}"` : "";
          return `<${tag} class="moon step ${slackPathNode(c) ? "haze path" : ""}"${enter} style="left:${p.left}%;top:${p.top}%">
            <span class="globe"></span>
            <span class="pname">${escapeHtml(c.name)}</span>
          </${tag}>`;
        }
        if (asBoxes) {
          const on = c.id === node.id;
          const deeper = (c.children || []).length > 0;
          const extra = !!(c.who && c.who !== c.name);
          if (!deeper && !extra) {
            return `<div class="land still" data-box="${i}" style="left:${p.left}%;top:${p.top}%">
              <span class="pname">${escapeHtml(c.name)}</span>
            </div>`;
          }
          return `<button class="land ${on ? "on" : ""} ${slackPathNode(c) ? "haze path" : ""}" type="button" data-enter="${c.id}" data-box="${i}" style="left:${p.left}%;top:${p.top}%">
            <span class="pname">${escapeHtml(c.name)}</span>
          </button>`;
        }
        if (c.unexplored) {
          return `<button class="body nebula haze path" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%">
            <span class="cloud c1"></span>
            <span class="cloud c2"></span>
            <span class="cloud c3"></span>
            <span class="g-name">${escapeHtml(c.name)}</span>
            ${g ? `<span class="gone-mark">gone into</span>` : ""}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        const kind = atUniverse ? "galaxy" : uniDepth === 1 ? "star-sys" : "planet";
        const mark = g ? `<span class="gone-mark">gone into</span>` : "";
        if (kind === "galaxy") {
          return `<button class="body galaxy haze ${nodeIsMapped(c) ? "known" : ""}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%">
            <span class="g-halo"></span>
            ${c.id === "connection" ? `<span class="g-strata">TCP · UDP · Stream.Send</span>` : ""}
            ${galaxySvg(knownI, hues[knownI % hues.length])}
            <span class="g-name">${escapeHtml(c.name)}</span>
            ${mark}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        if (kind === "star-sys") {
          const starK = rockClass ? "" : kindFrom(c.id, STAR_KINDS);
          const tw = idHash(c.id);
          return `<button class="body star-sys${rockClass} ${starK} ${farClass(c)}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%${zStyle};--tw:${(2.6 + (tw % 5) * 0.7).toFixed(2)}s;--tw-delay:-${tw % 7}s">
            ${rockTag}
            <span class="orbit"></span>
            <span class="fire"></span>
            <span class="core"></span>
            <span class="pname">${escapeHtml(c.name)}</span>
            ${mark}
            ${g && n ? `<span class="g-count">${n}</span>` : ""}
          </button>`;
        }
        const pKind = kindFrom(c.id, PLANET_KINDS);
        const near = p.front != null ? (0.7 + p.front * 0.42).toFixed(2) : "1";
        const z = p.front != null ? 3 + Math.round(p.front * 5) : 3;
        return `<button class="planet ${pKind} ${planetHasRings(pKind) ? "has-rings" : ""} ${farClass(c)}" type="button" data-enter="${c.id}" style="left:${p.left}%;top:${p.top}%;z-index:${z};--near:${near};${spinVars(c.id)}">
          ${planetHasRings(pKind) ? planetRingHtml() : `<span class="globe"></span>`}
          <span class="pname">${escapeHtml(c.name)}</span>
          ${mark}
          ${g && n ? `<span class="count">${n}</span>` : ""}
        </button>`;
      }).join("");

      const moons = issues.map((iss, i) => {
        const p = bodyOrbitPos(i, issues.length, now, moonRx, moonRy, moonPeriod);
        const on = issue && String(issue.id) === String(iss.id) ? "on" : "";
        const seen = hasLooked(iss.id);
        const deep = seen && hasNextBoxes(iss);
        const maybe = iss.status === "maybe";
        const st = STATUS_CLASS[iss.status] || "";
        const tag = issueTag(iss);
        const lab = issueLabel(iss);
        const mapped = isMappedTicket(iss);
        const sub = mapped
          ? [deep ? countBoxes(iss.thread) + " next" : "", isGateIssue(iss.id) ? lab : ""].filter(Boolean).join(" · ")
          : "";
        const slack = iss.source === "slack";
        return `<button class="moon ${on} ${maybe ? "maybe" : ""} ${mapped ? "" : "haze"} ${slack ? "path" : ""} ${st}" type="button" data-issue="${iss.id}" title="${escapeHtml(tag + " " + lab)}" style="left:${p.left}%;top:${p.top}%">
          <span class="globe"></span>
          <span class="pname">${escapeHtml(tag)}</span>
          ${sub ? `<small>${escapeHtml(sub)}</small>` : ""}
        </button>`;
      }).join("");

      const worldBodies = strataHere
        ? `<div class="depth-stage" id="depthStage">
            <div class="depth-world" id="depthWorld" style="transform:rotateX(${phoneSky() ? 4 : strataTilt.x}deg) rotateY(${phoneSky() ? 0 : strataTilt.y}deg)">
              <div class="plane-ring tcp"></div>
              <div class="plane-ring udp"></div>
              <button class="plane-lab tcp tcp-chip" type="button" data-rock="tcp"><small>Websocket</small>TCP</button>
              <button class="plane-lab udp udp-chip" type="button" data-rock="udp"><small>WebRTC</small>UDP</button>
              <svg class="filament" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M50 32 Q62 48 76 66"/>
              </svg>
              ${bodies}
            </div>
          </div>`
        : bodies;

      const showMoonLand = (atTicket || atBox) && !cosmic;
      const showStar = uniDepth === 2 && !strataHere && !atRock && !atRockBox && !showMoonLand && !cosmic && !node.unexplored;
      const showPlanetHere = uniDepth >= 3 && !showMoonLand && !cosmic && !atRock && !atRockBox && !node.unexplored;
      const showStarRing = uniDepth === 1 && !strataHere && !atRock && !atRockBox && !node.unexplored && knownKids.length;
      const showPlanetRing = uniDepth === 2 && !strataHere && !atRock && !atRockBox && !node.unexplored && knownKids.length;
      const showMoonRing = issues.length && !strataHere && !atRock && !atRockBox && !showMoonLand && !cosmic && uniDepth !== 1 && uniDepth >= 0;
      const gateIss = gateHere ? lookupIssue(parsedHere.id) : null;
      const placeLab = atUniverse
        ? "LiveKit"
        : gateHere && gateIss
        ? issueTag(gateIss)
        : node.name;
      const place = onPhone() ? "" : `<div class="place">${escapeHtml(placeLab)}</div>`;
      const hereKind = showPlanetHere ? kindFrom(node.id, PLANET_KINDS) : "";
      const centerObj = (atRock || atRockBox)
        ? `<div class="rock-read ${node.rock || ""}">
            <span class="pname">${escapeHtml(node.name)}</span>
            <p class="sub">${escapeHtml(node.who || "")}</p>
          </div>`
        : cosmic
        ? ""
        : onlyNext
        ? hereMoonHtml(`${atBox ? "box" : "landed"} clickable`, `<span class="pname">${escapeHtml(node.name)}</span>`, onlyNext.id)
        : boxSteps.length
        ? ""
        : gateHere
        ? hereMoonHtml("landed gate", `<span class="pname">${escapeHtml(issueTag(gateIss))}</span><span class="plabel">${escapeHtml(issueLabel(gateIss))}</span>`)
        : showMoonLand
        ? hereMoonHtml(atBox ? "box" : "landed", `<span class="pname">${escapeHtml(node.name)}</span>`)
        : showStar
        ? `<div class="here-star">${starFireSvg(node.id)}<span class="pname">${escapeHtml(node.name)}</span></div>`
        : showPlanetHere
        ? `<div class="here-planet ${hereKind}${planetHasRings(hereKind) ? " has-rings" : ""}" style="${spinVars(node.id)}">${planetHasRings(hereKind) ? planetRingHtml() : `<span class="globe"></span>`}<span class="pname">${escapeHtml(node.name)}</span></div>`
        : "";

      const scale = atEngine || atEngineStay ? "engine"
        : atWorldline || atWorldlineStay ? "worldline"
        : atDna || atBase ? "helix"
        : atBeacon || atSignal ? "beacon"
        : showMoonLand && atBox ? "box"
        : showMoonLand ? "ticket"
        : atRock || atRockBox ? "plane"
        : strataHere ? "planes"
        : node.unexplored ? "nebula"
        : atUniverse ? "universe"
        : uniDepth === 1 ? "galaxy"
        : uniDepth === 2 ? "star"
        : "planet";
      sky.className = "sky scale-" + scale + (state.strata ? " strata-on" : "") + ((atRock || atRockBox) && node.rock ? " " + node.rock + "-sky" : "");

      const kepler = showStarRing || showPlanetRing || showMoonRing
        ? `<svg class="kepler" viewBox="0 0 100 100" preserveAspectRatio="none">
            ${showStarRing ? gritOrbit(starRx, starRy) : ""}
            ${showPlanetRing ? gritOrbit(planetRx, planetRy) : ""}
            ${showMoonRing ? gritOrbit(moonRx, moonRy, "moons") : ""}
          </svg>`
        : "";

      const skyDust = (!strataHere && !atRock && !atRockBox)
        ? starfieldHtml()
        : "";
      const belts = showPlanetRing ? beltHtml("star") : showStarRing ? beltHtml("galaxy") : showPlanetHere ? beltHtml("planet") : "";

      document.getElementById("sky").innerHTML = `
        ${skyDust}
        ${belts}
        ${atUniverse ? `<div class="milky"></div>` : ""}
        ${gateHere && rootedInIssue ? `<div class="milky milky-out"></div>` : ""}
        ${atUniverse ? webHtml(webPts) : ""}
        ${uniDepth === 1 && !strataHere && !node.unexplored ? `<div class="in-galaxy"></div>` : ""}
        ${strataHere ? `<div class="plane-wash"></div>` : ""}
        ${node.unexplored ? `<div class="nebula-wash"></div>` : ""}
        ${kepler}
        ${atRock || atRockBox ? `<div class="horizon ${node.rock}"></div>` : ""}
        ${place}
        ${centerObj}
        ${worldBodies}
        ${gateHere && rootedInIssue ? `<button class="body galaxy out-universe haze" type="button" data-out="universe">
            <span class="g-halo"></span>
            ${galaxySvg(0, 32)}
            <span class="g-name">LiveKit</span>
          </button>` : ""}
        ${strataHere ? `
          <button class="land rock-door" type="button" data-rock="tcp" style="${phoneSky() ? "left:18%;top:14%" : "left:16%;top:22%"}">
            <span class="pname">TCP</span>
            <small>ordered stream</small>
          </button>
          <button class="land rock-door send" type="button" data-rock="stream-send" style="${phoneSky() ? "left:50%;top:14%" : "left:50%;top:12%"}">
            <span class="pname">Stream.Send</span>
            <small>batch onto TCP</small>
          </button>
          <button class="land rock-door udp" type="button" data-rock="udp" style="${phoneSky() ? "left:82%;top:14%" : "left:78%;top:22%"}">
            <span class="pname">UDP</span>
            <small>WebRTC media</small>
          </button>` : ""}
        ${showMoonLand ? "" : moons}
      `;
      document.querySelectorAll("[data-enter]").forEach((b) => b.addEventListener("click", () => enterChild(b.dataset.enter, b)));
      document.querySelectorAll("[data-warp]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        warpFromSky(b.dataset.warp);
      }));
      document.querySelectorAll("#sky [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      document.querySelectorAll("#sky [data-issue]").forEach((b) => b.addEventListener("click", () => enterIssue(b.dataset.issue, b)));
      document.querySelectorAll("[data-rock]").forEach((b) => b.addEventListener("click", () => enterRock(b.dataset.rock)));
      document.querySelectorAll("[data-out]").forEach((b) => b.addEventListener("click", () => {
        if (state.path[0] === "universe") return;
        document.querySelectorAll("[data-enter], [data-issue], [data-out]").forEach((x) => {
          if (x !== b) x.classList.add("fade");
        });
        b.classList.add("zoom");
        flyThen(applyUniverse, "out");
      }));
      bindStrataDrag();
      if (!atLab && !atEngine && !atEngineStay) labStop();
      if (atDna || atBase) {
        startCosmicMotion({ helixKids: atDna ? kids : (parent.children || []), onId: atBase ? node.id : null });
      } else if (atWorldline || atWorldlineStay) {
        startCosmicMotion({ mini: true });
      } else if (atEngine || atEngineStay || atLab) {
        startCosmicMotion({ mini: true });
        bindLab();
      } else if (atBeacon || atSignal) {
        startCosmicMotion({ signals: true });
      } else if (atTicket || atBox || atRock || atRockBox) {
        stopSkyMotion();
      } else if (strataHere) {
        startStrataMotion();
      } else if (atRock) {
        stopSkyMotion();
      } else {
        const groups = [];
        if (atUniverse) groups.push({ sel: "#sky .galaxy", rx: 32, ry: 30, period: galPeriod, web: true });
        else if (uniDepth === 1) groups.push({ sel: "#sky .star-sys", rx: starRx, ry: starRy, period: starPeriod });
        else if (uniDepth === 2) groups.push({ sel: "#sky .planet", rx: planetRx, ry: planetRy, period: planetPeriod });
        else if (uniDepth > 2) groups.push({ sel: "#sky .planet", rx: 30, ry: 26, period: planetPeriod });
        if (document.querySelector("#sky .moon")) groups.push({ sel: "#sky .moon", rx: moonRx, ry: moonRy, period: moonPeriod });
        startSkyMotion(groups);
      }

      const chips = atRock || atRockStay
        ? `<div class="dock-tix">
            <button type="button" class="${node.rock === "tcp" && atRock ? "on" : ""}" data-rock="tcp">TCP</button>
            <button type="button" class="${node.rock === "send" && atRock ? "on" : ""}" data-rock="stream-send">Stream.Send</button>
            <button type="button" class="${node.rock === "udp" && atRock ? "on" : ""}" data-rock="udp">UDP</button>
          </div>`
        : !atTicket && !atBox && issues.length
        ? `<div class="dock-tix">${issues.map((iss) => ticketChipHtml(iss, issue && issue.id)).join("")}</div>`
        : atEngine || atEngineStay
        ? ""
        : atWorldlineStay
        ? `<div class="dock-tix">${(parent.children || []).map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : cosmic && (atWorldline || atDna || atBeacon) && kids.length
        ? `<div class="dock-tix">${kids.map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : (atBase && parent && parent.children || atSignal && parent && parent.children)
        ? `<div class="dock-tix">${(parent.children || []).map((c) => `
            <button type="button" class="${c.id === node.id ? "on" : ""}" data-enter="${c.id}">${escapeHtml(c.name)}</button>
          `).join("")}</div>`
        : "";
      if (rootedInIssue) {
        document.getElementById("brief").innerHTML = "";
      } else {
      document.getElementById("brief").innerHTML = `
        <p class="kicker">${escapeHtml(node.name)}</p>
          <p class="who">${escapeHtml(atRock || atRockBox ? (node.who || "") : strataHere ? "Click TCP, UDP, or Stream.Send. TCP is the ordered stream. Stream.Send writes a batch onto that person's TCP. UDP skips a hole and keeps voice flowing." : (node.who || ""))}</p>
          ${node.id === "room" && node.deep ? `<p class="who">${escapeHtml(node.deep)}</p>` : ""}
        ${chips}
      `;
      document.querySelectorAll("#brief [data-enter]").forEach((b) => b.addEventListener("click", () => enterChild(b.dataset.enter, b)));
      document.querySelectorAll("#brief [data-go]").forEach((b) => b.addEventListener("click", () => goTo(b.dataset.go)));
      document.querySelectorAll("#brief [data-issue]").forEach((b) => b.addEventListener("click", () => enterIssue(b.dataset.issue)));
      document.querySelectorAll("#brief [data-rock]").forEach((b) => b.addEventListener("click", () => enterRock(b.dataset.rock)));
      }
      renderGoneInto();
      notePlace();
    }

    function renderGoneInto() {
      const root = document.getElementById("gone");
      const air = lookupIssue(4477);
      const room = lookupIssue(4726);
      const featured = [air, room].filter(Boolean);
      const featuredIds = new Set(featured.map((iss) => String(iss.id)));
      const rest = allTickets().filter((iss) => !featuredIds.has(String(iss.id)));
      const onId = state.watching ? state.watching.id : state.selectedIssue;
      const showSteps = !!state.showAirSteps;
      const card = (iss, head) => {
        const title = head || issueLabel(iss) || iss.title || "";
        const blurb = iss.see || "";
        const tix = iss.url
          ? `<a class="gone-tix" href="${escapeHtml(iss.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(issueTag(iss))}</a>`
          : `<span class="gone-tix">${escapeHtml(issueTag(iss))}</span>`;
        return `
          <button type="button" class="${String(onId) === String(iss.id) ? "on" : ""} ${iss.source === "slack" ? "path" : ""}" data-gone="${iss.id}">
            <b>${escapeHtml(title)}</b>
            ${blurb ? `<span class="gone-blurb">${escapeHtml(blurb)}</span>` : ""}
            ${tix}
          </button>`;
      };
      const walkHtml = (iss) => {
        const steps = (iss && iss.steps) || [];
        if (!steps.length) return "";
        return `<div class="walk-steps">${steps.map((s, i) => {
          const n = i + 1;
          const open = state.walkStep === n;
          return `<button type="button" class="walk-step${open ? " on" : ""}" data-walk="${n}">
            <span class="walk-n">${n}</span>
            <b>${escapeHtml(s.ask)}</b>
            ${open && s.say ? `<span class="walk-say">${escapeHtml(s.say)}</span>` : ""}
          </button>`;
        }).join("")}</div>`;
      };
      const airCard = air ? card(air, "Airplane mode") : "";
      const airWalk = showSteps ? walkHtml(air) : "";
      const roomCard = room ? card(room, "I deleted a room and quickly tried to create a room with the same name") : "";
      const leadRoom = String(HOME_GATE.issueId) === "4726";
      root.innerHTML = `
        <p class="kicker">Shortcuts</p>
        ${leadRoom ? roomCard + airCard + airWalk : airCard + airWalk + roomCard}
        ${rest.length ? `<div class="gone-rest"><p class="kicker">Also there</p>${rest.map((iss) => card(iss)).join("")}</div>` : ""}
      `;
      root.querySelectorAll("[data-gone]").forEach((b) => b.addEventListener("click", () => openGoneInto(b.dataset.gone)));
      root.querySelectorAll("[data-walk]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = Number(b.dataset.walk);
        state.walkStep = state.walkStep === n ? null : n;
        renderGoneInto();
      }));
      root.querySelectorAll(".gone-tix").forEach((a) => a.addEventListener("click", (e) => e.stopPropagation()));
    }
    window.addEventListener("hashchange", () => {
      const g = resolveGate(readEntryKey()) || GATES[0];
      if (String(g.issueId) === String(HOME_GATE.issueId) && atGateHome()) return;
      landOnGate(g);
      persist();
      render();
    });
    document.getElementById("logo").addEventListener("click", exploreUniverse);
    document.getElementById("padHide").addEventListener("click", () => setPadHidden(true));
    document.getElementById("padShow").addEventListener("click", () => setPadHidden(false));
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "TEXTAREA" || tag === "INPUT") return;
      if (e.key === "Escape") { stepBack(); return; }
    });

    render();
  </script>
</body>
</html>
